<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <img src="https://zoo.gdansk.pl/wp-content/uploads/img-6037-1-scaled.jpg" alt="kot pustynny">
        <div class="naglowek">
          <h1> Jan Matysiak</h1>
          <p> Technik programista</p>
        </div>
    </header>
    <main>
        <section class="umiejetnosci">
            <h2>Umiejetnosci</h2>
            <p>
                <ul>
                    <li>HTML</li>
                    <li>CSS</li>
                    <li>JS</li>
                    <li>REACT</li>
                </ul>
            </p>
        </section>

        <section id="kontakt">
            <h2>Kontakt</h2>
      
            <form id="formularz" novalidate>
      
              <div class="pole">
                <label for="imie">Imię i nazwisko</label>
                <input type="text" id="imie" name="imie" class="inp">
                <p class="blad" id="blad-imie"></p>
              </div>
      
              <div class="pole">
                <label for="email">Adres e-mail</label>
                <input type="email" id="email" name="email" class="inp">
                <p class="blad" id="blad-email"></p>
              </div>
      
              <div class="pole">
                <label for="temat">Temat</label>
                <select id="temat" name="temat" class="inp">
                  <option value="">— wybierz temat —</option>
                  <option value="wspolpraca">Propozycja współpracy</option>
                  <option value="pytanie">Pytanie o projekt</option>
                  <option value="inne">Inne</option>
                </select>
                <p class="blad" id="blad-temat"></p>
              </div>
      
              <div class="pole">
                <label for="wiadomosc">Wiadomość</label>
                <textarea id="wiadomosc" name="wiadomosc" rows="5" class="inp"></textarea>
                <p class="blad" id="blad-wiadomosc"></p>
              </div>
      
              <button type="submit" class="przycisk inp">Wyślij wiadomość</button>
            </form>

            <div id="podziekowanie" class="podziekowanie" hidden>
              <h3>Dziękuję za wiadomość!</h3>
              <p id="podziekowanie-tresc"></p>
            </div>
          </section>
      
    </main>
    <footer class="stopka">
        <p>
          Jan Matysiak ·
          <a href="https://github.com/Efczi">GitHub</a> ·
          <a href="mailto:Jan.Matysiak@example.com">Jan.Matysiak@example.com</a>
        </p>
      </footer>
    
      <script src="main.js"></script>
    
</body>
</html>
